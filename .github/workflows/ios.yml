name: 构建 iOS 未签名 IPA

on:
  workflow_dispatch:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"

permissions:
  contents: write

concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_NAME: WebHomeTV
  BUNDLE_ID: com.webhometv.app
  DERIVED_DATA: ios/build

jobs:
  ios:
    name: iOS arm64 未签名 IPA
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 检测 Xcode 版本
        run: |
          xcodebuild -version
          swift --version

      - name: 安装 XcodeGen
        run: |
          brew install xcodegen

      - name: 生成 Xcode 工程
        working-directory: ios
        shell: bash
        run: |
          xcodegen generate --spec project.yml
          test -f WebHomeTV.xcodeproj/project.pbxproj

      - name: 选择可用模拟器
        id: sim
        shell: bash
        run: |
          set -uo pipefail
          # macos-latest 镜像会随 Xcode 升级而更新（例如 Xcode 26 已无 iPhone 15），
          # 因此用 simctl 动态挑选一个可用设备，避免硬编码设备名。
          pick() {
            xcrun simctl list devices available \
              | grep -E "^[[:space:]]+$1" \
              | sed -E 's/.*\(([0-9A-Fa-f-]{36})\).*/\1/' \
              | head -n 1
          }
          UDID="$(pick iPhone || true)"
          if [ -z "$UDID" ]; then UDID="$(pick iPad || true)"; fi
          if [ -z "$UDID" ]; then
            echo "未找到可用的 iOS 模拟器，单元测试将被跳过"
          else
            echo "选中模拟器: $(xcrun simctl list devices available | grep "$UDID")"
          fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: 运行单元测试
        working-directory: ios
        shell: bash
        continue-on-error: true
        run: |
          set -uo pipefail
          UDID="${{ steps.sim.outputs.udid }}"
          if [ -z "$UDID" ]; then
            echo "没有可用模拟器，跳过单元测试"
            exit 0
          fi
          xcodebuild test \
            -project WebHomeTV.xcodeproj \
            -scheme WebHomeTV \
            -destination "platform=iOS Simulator,id=$UDID" \
            CODE_SIGNING_ALLOWED=NO
        env:
          SKIP_TEST_BUILD: ""

      - name: 构建 Release（不签名）
        working-directory: ios
        shell: bash
        run: |
          xcodebuild \
            -project WebHomeTV.xcodeproj \
            -scheme WebHomeTV \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: 检查打包内容
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="${{ env.DERIVED_DATA }}/Build/Products/Release-iphoneos/WebHomeTV.app"
          echo "===== .app 总大小 ====="
          du -sh "$APP_PATH"
          echo ""
          echo "===== 顶层结构 ====="
          ls -la "$APP_PATH"
          echo ""
          echo "===== 二进制可执行文件 ====="
          find "$APP_PATH" -maxdepth 1 -type f -perm +111 2>/dev/null | xargs -r ls -lh
          BIN="$APP_PATH/WebHomeTV"
          if [ -f "$BIN" ]; then echo "二进制大小:"; ls -lh "$BIN"; fi
          echo ""
          echo "===== JS 资源清单 ====="
          if [ -d "$APP_PATH/JS" ]; then
            find "$APP_PATH/JS" -type f | sort
            echo "JS 资源合计:"
            du -ch "$APP_PATH"/JS/lib/*.js 2>/dev/null | tail -1
          else
            echo "未找到 JS 目录！"
          fi
          echo ""
          echo "===== 各类型体积构成 ====="
          du -ah "$APP_PATH" | sort -rh | head -20
      - name: 打包未签名 IPA
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="${{ env.DERIVED_DATA }}/Build/Products/Release-iphoneos/WebHomeTV.app"
          test -d "$APP_PATH"
          mkdir -p dist/Payload
          cp -R "$APP_PATH" dist/Payload/
          (cd dist && zip -qry "${APP_NAME}-ios-arm64-unsigned.ipa" Payload)
          rm -rf dist/Payload
          ls -lh "dist/${APP_NAME}-ios-arm64-unsigned.ipa"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-unsigned
          path: dist/${{ env.APP_NAME }}-ios-arm64-unsigned.ipa
          if-no-files-found: error
